<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="styss.css">
</head>

<body>
    <h1 class="head">Rock Paper Scissors</h1>
    <div class="imgsContainer">
        <div id="rock" class="imgs">
            <img src="rock.png">
        </div>
        <div id="paper" class="imgs">
            <img src="paper.png">
        </div>
        <div id="scissors" class="imgs">
            <img src="scissors.png">
        </div>
    </div>

    <div class="scoreContainer">
        <div class="userScore">
            <p id="userSco">0</p>
            <p>You</p>
        </div>

        <div class="comscore">
            <p id="ComputerScore">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msgContainer">
        <p class="msg">Play Your Move</p>
    </div>
    <script src="apps.js"></script>
</body>

</html>
